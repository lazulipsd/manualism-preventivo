        <style>
            :root {
                --bg: #0c0e10;
                --bg-2: #111417;
                --teal: #0f3f48;
                --lime: #d8ff43;
                --white: #f4f1ea;
                --muted: rgba(244, 241, 234, 0.55);
                --line: rgba(244, 241, 234, 0.10);
                --line-strong: rgba(244, 241, 234, 0.16);
            }

            * { box-sizing: border-box; margin: 0; padding: 0; }

            .staticrypt-html { height: 100%; }
            .staticrypt-body {
                height: 100%;
                margin: 0;
                font-family: 'Vend Sans', system-ui, -apple-system, sans-serif;
                color: var(--white);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-content {
                height: 100%;
                margin: 0;
                background:
                    radial-gradient(900px 500px at 85% -10%, rgba(216, 255, 67, 0.06), transparent 60%),
                    radial-gradient(700px 400px at -5% 20%, rgba(15, 63, 72, 0.55), transparent 65%),
                    var(--bg);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 440px;
                margin: 0;
                padding: 0;
            }

            .staticrypt-form {
                background: var(--bg-2);
                border: 1px solid var(--line-strong);
                border-radius: 28px;
                padding: 40px 36px 32px;
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
                text-align: left;
            }

            .staticrypt-brand {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 22px;
                font-family: 'Instrument Serif', serif;
                font-size: 18px;
                color: var(--white);
                letter-spacing: 0.3px;
            }
            .staticrypt-brand .dot {
                width: 8px; height: 8px;
                background: var(--lime);
                border-radius: 50%;
                box-shadow: 0 0 14px rgba(216, 255, 67, 0.65);
            }

            .staticrypt-instructions {
                margin: 0 0 26px 0;
            }
            .staticrypt-title {
                font-family: 'Instrument Serif', serif;
                font-size: 32px;
                font-weight: 400;
                line-height: 1.05;
                letter-spacing: -0.01em;
                color: var(--white);
                margin-bottom: 10px;
            }
            .staticrypt-instructions p:not(.staticrypt-title) {
                color: var(--muted);
                font-size: 14px;
                line-height: 1.5;
                font-family: 'Vend Sans', sans-serif;
            }

            .staticrypt-hr {
                display: none;
            }

            .staticrypt-password-container {
                position: relative;
                background: rgba(244, 241, 234, 0.04);
                border: 1px solid var(--line);
                border-radius: 14px;
                margin-bottom: 14px;
                transition: border-color 0.25s ease, background 0.25s ease;
            }
            .staticrypt-password-container:focus-within {
                border-color: rgba(216, 255, 67, 0.5);
                background: rgba(216, 255, 67, 0.04);
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                outline: 0;
                width: 100%;
                padding: 16px 50px 16px 18px;
                font-size: 15px;
                font-family: 'Vend Sans', sans-serif;
                color: var(--white);
                font-weight: 400;
            }
            .staticrypt-form input::placeholder {
                color: rgba(244, 241, 234, 0.4);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 0.5;
                padding: 14px;
                box-sizing: content-box;
                position: absolute;
                right: 4px;
                top: 50%;
                transform: translateY(-50%);
                filter: invert(1);
                transition: opacity 0.2s ease;
            }
            .staticrypt-toggle-password-visibility:hover {
                opacity: 0.85;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 18px;
                font-size: 13px;
                color: var(--muted);
                cursor: pointer;
                user-select: none;
            }
            .staticrypt-remember input[type="checkbox"] {
                appearance: none;
                -webkit-appearance: none;
                width: 18px;
                height: 18px;
                border: 1px solid var(--line-strong);
                border-radius: 5px;
                background: rgba(244, 241, 234, 0.04);
                cursor: pointer;
                position: relative;
                transition: all 0.2s ease;
                flex-shrink: 0;
            }
            .staticrypt-remember input[type="checkbox"]:checked {
                background: var(--lime);
                border-color: var(--lime);
            }
            .staticrypt-remember input[type="checkbox"]:checked::after {
                content: '';
                position: absolute;
                left: 5px;
                top: 1px;
                width: 5px;
                height: 10px;
                border: solid var(--bg);
                border-width: 0 2px 2px 0;
                transform: rotate(45deg);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                font-family: 'Vend Sans', sans-serif;
                font-size: 13px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 1.6px;
                outline: 0;
                background: var(--lime);
                color: var(--bg);
                width: 100%;
                border: 0;
                padding: 16px;
                border-radius: 999px;
                cursor: pointer;
                transition: transform 0.25s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s ease, background 0.25s ease;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover {
                transform: translateY(-1px);
                box-shadow: 0 12px 32px rgba(216, 255, 67, 0.35);
            }
            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: translateY(0);
                box-shadow: 0 6px 18px rgba(216, 255, 67, 0.25);
            }
            .staticrypt-form .staticrypt-decrypt-button:focus-visible {
                box-shadow: 0 0 0 3px rgba(216, 255, 67, 0.35);
            }

            .staticrypt-error {
                margin-top: 14px;
                padding: 12px 14px;
                border-radius: 12px;
                background: rgba(255, 99, 99, 0.08);
                border: 1px solid rgba(255, 99, 99, 0.3);
                color: #ff8585;
                font-size: 13px;
                line-height: 1.4;
                opacity: 0;
                transform: translateY(-4px);
                transition: opacity 0.3s ease, transform 0.3s ease;
                pointer-events: none;
            }
            .staticrypt-error.visible {
                opacity: 1;
                transform: translateY(0);
                pointer-events: auto;
            }

            .staticrypt-footer {
                margin-top: 20px;
                text-align: center;
                font-size: 11px;
                letter-spacing: 1.4px;
                text-transform: uppercase;
                color: rgba(244, 241, 234, 0.35);
            }

            .hidden { display: none !important; }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bg);
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                border: 3px solid rgba(216, 255, 67, 0.2);
                border-top-color: var(--lime);
                border-radius: 50%;
                animation: spinner-border 0.85s linear infinite;
            }
            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] {
                    font-size: 16px;
                }
            }

            @media (max-width: 480px) {
                .staticrypt-form { padding: 32px 24px 26px; border-radius: 24px; }
                .staticrypt-title { font-size: 28px; }
            }
        </style>
    </head>
